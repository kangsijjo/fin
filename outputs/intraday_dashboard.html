<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장중 실시간 대시보드</title>
<style>
  :root {
    --bg:      #0d1117;
    --bg2:     #161b22;
    --bg3:     #21262d;
    --border:  #30363d;
    --text:    #e6edf3;
    --muted:   #8b949e;
    --green:   #3fb950;
    --red:     #f85149;
    --yellow:  #d29922;
    --blue:    #58a6ff;
    --purple:  #bc8cff;
    --accent:  #238636;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; font-size: 13px; }

  /* ── 헤더 ── */
  .header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .header h1 { font-size: 16px; font-weight: 600; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .status-pill {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 20px; padding: 3px 12px; font-size: 12px;
  }
  .status-pill.ok   { border-color: var(--green); color: var(--green); }
  .status-pill.err  { border-color: var(--red);   color: var(--red);   }
  .status-pill.stale{ border-color: var(--yellow); color: var(--yellow); }
  #timer { font-size: 12px; color: var(--muted); min-width: 80px; }
  .btn {
    background: var(--accent); color: #fff; border: none;
    padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .btn:hover { filter: brightness(1.2); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .btn-ghost:hover { background: var(--bg3); }

  /* ── 탭 ── */
  .tabs {
    display: flex; gap: 2px;
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 0 20px;
  }
  .tab {
    padding: 10px 16px; cursor: pointer; font-size: 13px; color: var(--muted);
    border-bottom: 2px solid transparent; transition: color .15s;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }
  .tab .badge {
    display: inline-block; background: var(--bg3); border-radius: 10px;
    padding: 1px 6px; font-size: 11px; margin-left: 4px; color: var(--muted);
  }

  /* ── 패널 ── */
  .panel { display: none; padding: 20px; }
  .panel.active { display: block; }

  /* ── 상단 정보바 ── */
  .info-bar {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .info-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px; min-width: 140px;
    flex: 1;
  }
  .info-card .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .info-card .value { font-size: 20px; font-weight: 700; }

  /* ── 테이블 ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    background: var(--bg3); color: var(--muted); font-weight: 600;
    padding: 8px 10px; text-align: right; font-size: 12px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
    position: sticky; top: 0;
  }
  th:first-child, th:nth-child(2), th:nth-child(3) { text-align: left; }
  td {
    padding: 7px 10px; text-align: right;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  td:first-child, td:nth-child(2), td:nth-child(3) { text-align: left; }
  tr:hover td { background: var(--bg3); }
  .rank { color: var(--muted); font-size: 12px; width: 30px; }
  .code { color: var(--muted); font-size: 11px; }
  .name { font-weight: 500; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .up   { color: var(--red); }
  .dn   { color: var(--blue); }
  .neu  { color: var(--muted); }

  /* ── 보유종목 특별 컬럼 ── */
  .pnl-pos { color: var(--green); font-weight: 700; }
  .pnl-neg { color: var(--red);   font-weight: 700; }
  .strategy-tag {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--muted);
  }

  /* ── 빈 상태 ── */
  .empty {
    text-align: center; padding: 60px 20px; color: var(--muted);
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }

  /* ── 로딩 ── */
  .loading-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center;
    z-index: 999; font-size: 18px;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    border: 3px solid var(--bg3); border-top-color: var(--blue);
    width: 36px; height: 36px; border-radius: 50%;
    animation: spin .8s linear infinite; margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 알림 토스트 ── */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 18px;
    opacity: 0; transform: translateY(10px);
    transition: all .3s; z-index: 9999; font-size: 13px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<!-- 로딩 오버레이 -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <span>데이터 수집 중...</span>
</div>

<!-- 알림 토스트 -->
<div class="toast" id="toast"></div>

<!-- 헤더 -->
<div class="header">
  <h1>📈 장중 실시간 대시보드</h1>
  <div class="header-right">
    <span class="status-pill" id="statusPill">연결 중...</span>
    <span id="sourceLabel" style="font-size:11px;color:var(--muted)"></span>
    <span id="timer">다음 갱신: --:--</span>
    <button class="btn-ghost" onclick="toggleAutoRefresh()" id="autoBtn">⏸ 자동갱신 ON</button>
    <button class="btn" onclick="manualRefresh()" id="refreshBtn">🔄 지금 갱신</button>
  </div>
</div>

<!-- 탭 -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('positions')" id="tab-positions">
    보유종목 <span class="badge" id="badge-positions">0</span>
  </div>
  <div class="tab" onclick="switchTab('volume')" id="tab-volume">
    거래량 TOP20 <span class="badge" id="badge-volume">0</span>
  </div>
  <div class="tab" onclick="switchTab('inst')" id="tab-inst">
    기관수급 TOP20 <span class="badge" id="badge-inst">0</span>
  </div>
  <div class="tab" onclick="switchTab('foreign')" id="tab-foreign">
    외국인수급 TOP20 <span class="badge" id="badge-foreign">0</span>
  </div>
  <div class="tab" onclick="switchTab('exec')" id="tab-exec">
    체결강도 TOP20 <span class="badge" id="badge-exec">0</span>
  </div>
</div>

<!-- ① 보유종목 탭 -->
<div class="panel active" id="panel-positions">
  <div class="info-bar" id="posInfoBar"></div>
  <div class="table-wrap">
    <table id="tbl-positions">
      <thead>
        <tr>
          <th>#</th><th>종목코드</th><th>종목명</th><th>전략</th>
          <th>매수일</th><th>청산예정</th><th>매수가</th><th>현재가</th>
          <th>등락률</th><th>예상손익</th>
        </tr>
      </thead>
      <tbody id="tbody-positions"></tbody>
    </table>
  </div>
</div>

<!-- ② 거래량 탭 -->
<div class="panel" id="panel-volume">
  <div class="table-wrap">
    <table id="tbl-volume">
      <thead>
        <tr>
          <th>#</th><th>종목코드</th><th>종목명</th>
          <th>현재가</th><th>등락률</th><th>거래량</th><th>거래대금(억)</th>
        </tr>
      </thead>
      <tbody id="tbody-volume"></tbody>
    </table>
  </div>
</div>

<!-- ③ 기관수급 탭 -->
<div class="panel" id="panel-inst">
  <div class="table-wrap">
    <table id="tbl-inst">
      <thead>
        <tr>
          <th>#</th><th>종목코드</th><th>종목명</th>
          <th>현재가</th><th>등락률</th><th>기관순매수(백만)</th>
        </tr>
      </thead>
      <tbody id="tbody-inst"></tbody>
    </table>
  </div>
</div>

<!-- ④ 외국인수급 탭 -->
<div class="panel" id="panel-foreign">
  <div class="table-wrap">
    <table id="tbl-foreign">
      <thead>
        <tr>
          <th>#</th><th>종목코드</th><th>종목명</th>
          <th>현재가</th><th>등락률</th><th>외국인순매수(백만)</th>
        </tr>
      </thead>
      <tbody id="tbody-foreign"></tbody>
    </table>
  </div>
</div>

<!-- ⑤ 체결강도 탭 -->
<div class="panel" id="panel-exec">
  <div class="table-wrap">
    <table id="tbl-exec">
      <thead>
        <tr>
          <th>#</th><th>종목코드</th><th>종목명</th>
          <th>현재가</th><th>등락률</th><th>체결강도(%)</th>
        </tr>
      </thead>
      <tbody id="tbody-exec"></tbody>
    </table>
  </div>
</div>

<script>
const API_BASE = 'http://127.0.0.1:5001';
const REFRESH_INTERVAL = 15 * 60; // 15분 (초)

let countdown = REFRESH_INTERVAL;
let timerHandle = null;
let autoRefresh = true;
let lastData = null;

// ── 탭 전환 ──────────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

// ── 자동갱신 토글 ──────────────────────────────────────────────────────────
function toggleAutoRefresh() {
  autoRefresh = !autoRefresh;
  document.getElementById('autoBtn').textContent = autoRefresh ? '⏸ 자동갱신 ON' : '▶ 자동갱신 OFF';
}

// ── 카운트다운 타이머 ──────────────────────────────────────────────────────
function startTimer() {
  if (timerHandle) clearInterval(timerHandle);
  countdown = REFRESH_INTERVAL;
  timerHandle = setInterval(() => {
    countdown--;
    const m = String(Math.floor(countdown / 60)).padStart(2, '0');
    const s = String(countdown % 60).padStart(2, '0');
    document.getElementById('timer').textContent = `다음 갱신: ${m}:${s}`;
    if (countdown <= 0) {
      if (autoRefresh) fetchData();
      else countdown = REFRESH_INTERVAL;
    }
  }, 1000);
}

// ── 숫자 포맷 헬퍼 ────────────────────────────────────────────────────────
function fmtPrice(v)  { return v ? Number(v).toLocaleString() : '-'; }
function fmtWon(v)    { return v ? (v / 1e8).toFixed(1) + '억' : '-'; }
function fmtMil(v)    { return v ? (v / 1e6).toFixed(1) + 'M' : '-'; }
function fmtVol(v)    { return v ? Number(v).toLocaleString() : '-'; }
function pctClass(v)  { return v > 0 ? 'up' : v < 0 ? 'dn' : 'neu'; }
function pctStr(v)    {
  if (v == null || v === '') return '-';
  const n = parseFloat(v);
  return (n > 0 ? '+' : '') + n.toFixed(2) + '%';
}

// ── 보유종목 탭 렌더 ──────────────────────────────────────────────────────
function renderPositions(positions) {
  const tbody = document.getElementById('tbody-positions');
  const badge = document.getElementById('badge-positions');
  badge.textContent = positions.length;

  if (!positions.length) {
    tbody.innerHTML = '<tr><td colspan="10"><div class="empty"><div class="icon">📋</div>보유종목 없음</div></td></tr>';
    document.getElementById('posInfoBar').innerHTML = '';
    return;
  }

  let totalPnl = 0;
  positions.forEach(p => { totalPnl += parseFloat(p.pnl_pct || 0); });

  document.getElementById('posInfoBar').innerHTML = `
    <div class="info-card">
      <div class="label">보유종목 수</div>
      <div class="value">${positions.length}<span style="font-size:14px;font-weight:400"> 종목</span></div>
    </div>
    <div class="info-card">
      <div class="label">평균 손익률</div>
      <div class="value ${pctClass(totalPnl / positions.length)}">${(totalPnl / positions.length).toFixed(2)}%</div>
    </div>
  `;

  tbody.innerHTML = positions.map((p, i) => {
    const pnl = parseFloat(p.pnl_pct || 0);
    const cls = pnl >= 0 ? 'pnl-pos' : 'pnl-neg';
    const chgCls = pctClass(parseFloat(p.change_pct || 0));
    return `<tr>
      <td class="rank">${i + 1}</td>
      <td class="code">${p.code || ''}</td>
      <td class="name">${p.name || p.code}</td>
      <td><span class="strategy-tag">${p.strategy || '-'}</span></td>
      <td>${p.entry_date || '-'}</td>
      <td>${p.exit_date_plan || '-'}</td>
      <td>${fmtPrice(p.entry_price)}</td>
      <td>${fmtPrice(p.current_price)}</td>
      <td class="${chgCls}">${pctStr(p.change_pct)}</td>
      <td class="${cls}">${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}%</td>
    </tr>`;
  }).join('');
}

// ── 거래량 탭 렌더 ────────────────────────────────────────────────────────
function renderVolume(data) {
  const tbody = document.getElementById('tbody-volume');
  const badge = document.getElementById('badge-volume');
  badge.textContent = data.length;
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty"><div class="icon">📊</div>데이터 없음 — 장중 KIS API 필요</div></td></tr>';
    return;
  }
  tbody.innerHTML = data.map(r => {
    const cls = pctClass(parseFloat(r.change_pct || 0));
    return `<tr>
      <td class="rank">${r.rank}</td>
      <td class="code">${r.code}</td>
      <td class="name">${r.name || r.code}</td>
      <td>${fmtPrice(r.close)}</td>
      <td class="${cls}">${pctStr(r.change_pct)}</td>
      <td>${fmtVol(r.volume)}</td>
      <td style="text-align:right">${fmtWon(r.trading_value)}</td>
    </tr>`;
  }).join('');
}

// ── 기관수급 탭 렌더 ──────────────────────────────────────────────────────
function renderInst(data) {
  const tbody = document.getElementById('tbody-inst');
  const badge = document.getElementById('badge-inst');
  badge.textContent = data.length;
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty"><div class="icon">🏦</div>기관수급 데이터 없음 — 장중 KIS API 또는 15:30 이후 pykrx</div></td></tr>';
    return;
  }
  tbody.innerHTML = data.map(r => {
    const cls = pctClass(parseFloat(r.change_pct || 0));
    const netVal = parseInt(r.inst_net || 0);
    return `<tr>
      <td class="rank">${r.rank}</td>
      <td class="code">${r.code}</td>
      <td class="name">${r.name || r.code}</td>
      <td>${fmtPrice(r.close)}</td>
      <td class="${cls}">${pctStr(r.change_pct)}</td>
      <td class="up">${fmtMil(netVal)}</td>
    </tr>`;
  }).join('');
}

// ── 외국인수급 탭 렌더 ────────────────────────────────────────────────────
function renderForeign(data) {
  const tbody = document.getElementById('tbody-foreign');
  const badge = document.getElementById('badge-foreign');
  badge.textContent = data.length;
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty"><div class="icon">🌍</div>외국인수급 데이터 없음 — 장중 KIS API 또는 15:30 이후 pykrx</div></td></tr>';
    return;
  }
  tbody.innerHTML = data.map(r => {
    const cls = pctClass(parseFloat(r.change_pct || 0));
    const netVal = parseInt(r.foreign_net || 0);
    return `<tr>
      <td class="rank">${r.rank}</td>
      <td class="code">${r.code}</td>
      <td class="name">${r.name || r.code}</td>
      <td>${fmtPrice(r.close)}</td>
      <td class="${cls}">${pctStr(r.change_pct)}</td>
      <td class="up">${fmtMil(netVal)}</td>
    </tr>`;
  }).join('');
}

// ── 체결강도 탭 렌더 ──────────────────────────────────────────────────────
function renderExec(data) {
  const tbody = document.getElementById('tbody-exec');
  const badge = document.getElementById('badge-exec');
  badge.textContent = data.length;
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty"><div class="icon">⚡</div>체결강도 데이터 없음 — 장중 KIS API 필요</div></td></tr>';
    return;
  }
  tbody.innerHTML = data.map(r => {
    const strength = parseFloat(r.exec_strength || r.ccld_rate || 0);
    const strengthCls = strength >= 100 ? 'up' : strength < 80 ? 'dn' : 'neu';
    const cls = pctClass(parseFloat(r.change_pct || 0));
    return `<tr>
      <td class="rank">${r.rank}</td>
      <td class="code">${r.code}</td>
      <td class="name">${r.name || r.code}</td>
      <td>${fmtPrice(r.close)}</td>
      <td class="${cls}">${pctStr(r.change_pct)}</td>
      <td class="${strengthCls}">${strength.toFixed(1)}%</td>
    </tr>`;
  }).join('');
}

// ── 전체 렌더링 ───────────────────────────────────────────────────────────
function renderAll(d) {
  renderPositions(d.positions || []);
  renderVolume(d.volume_top20 || []);
  renderInst(d.inst_top20 || []);
  renderForeign(d.foreign_top20 || []);
  renderExec(d.exec_top20 || []);

  // 상태 업데이트
  const pill = document.getElementById('statusPill');
  const src  = d.data_source || '';
  if (src === 'no_cache') {
    pill.className = 'status-pill err';
    pill.textContent = '캐시 없음';
  } else if (src.includes('pykrx')) {
    pill.className = 'status-pill stale';
    pill.textContent = 'pykrx(종가기준)';
  } else {
    pill.className = 'status-pill ok';
    pill.textContent = 'KIS API';
  }

  const updated = d.updated_at;
  document.getElementById('sourceLabel').textContent = updated ? `갱신: ${updated}` : '';
}

// ── 캐시 데이터 조회 (/api/data, 가볍고 빠름) ─────────────────────────────
async function fetchData() {
  countdown = REFRESH_INTERVAL;
  try {
    const res = await fetch(`${API_BASE}/api/data`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    lastData = d;
    renderAll(d);
  } catch (e) {
    document.getElementById('statusPill').className = 'status-pill err';
    document.getElementById('statusPill').textContent = '서버 오프라인';
    document.getElementById('sourceLabel').textContent =
      'python intraday_server.py 실행 필요';
  }
}

// ── 수동 갱신 (/api/refresh, KIS API 호출하여 캐시 재생성) ──────────────
async function manualRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  document.getElementById('loadingOverlay').classList.add('show');

  try {
    const res = await fetch(`${API_BASE}/api/refresh`, { method: 'POST' });
    const d = await res.json();
    if (d.ok) {
      lastData = d;
      renderAll(d);
      showToast('✅ 데이터 갱신 완료 (' + (d.refreshed_at || '') + ')');
      countdown = REFRESH_INTERVAL;
    } else {
      showToast('⚠️ 갱신 실패: ' + (d.error || '알 수 없는 오류'));
    }
  } catch (e) {
    showToast('❌ 서버 연결 실패 — python intraday_server.py 실행 중인지 확인');
  } finally {
    btn.disabled = false;
    document.getElementById('loadingOverlay').classList.remove('show');
  }
}

// ── 토스트 알림 ───────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ── 초기화 ────────────────────────────────────────────────────────────────
(async function init() {
  await fetchData();
  startTimer();
})();
</script>
</body>
</html>
